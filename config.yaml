app:
  host: 127.0.0.1
  port: 8000
  simulation_mode: true
monitor:
  watch_paths:
  - ./data/sandbox
  - ./data/sensitive-lab/finance
  - ./data/sensitive-lab/hr
  - ./data/sensitive-lab/customer-data
  - ./data/sensitive-lab/legal
  - ./data/sensitive-lab/backups
  recursive: true
  observer: native
  queue_capacity: 10000
  debounce_ms: 100
  sample_bytes: 65536
  sample_retries: 2
  exclude_paths:
  - ./data/quarantine
  - ./data/reports
  - ./logs
  - ./evidence
  - ./data/demo-manifests
database:
  path: ./data/rdrs.db
  busy_timeout_ms: 5000
detection:
  window_seconds: 60
  tick_seconds: 1
  rapid_write_min_files: 20
  mass_rename_min_files: 20
  extension_change_min_files: 10
  high_entropy_min_files: 5
  entropy_threshold: 7.5
  cpu_threshold_percent: 80
  cpu_signal_enabled: false
  unknown_program_signal_enabled: false
  weights:
    rapid_high_entropy_writes: 40
    mass_rename: 30
    high_entropy: 25
    cpu_spike: 15
    unknown_program: 10
  warning_min: 40
  critical_min: 70
  incident_cooldown_seconds: 60
processes:
  sample_interval_seconds: 5
  allowlisted_executables: []
response:
  evidence_dir: ./data/quarantine
  max_files_per_incident: 100
  max_file_bytes: 10485760
  max_incident_bytes: 104857600
  simulate_termination: false
reports:
  output_dir: ./data/reports
dashboard:
  poll_interval_seconds: 2
logging:
  directory: ./logs
  rotation: 10 MB
  retention: 7 days
