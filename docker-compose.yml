services:
  rdrs:
    build: .
    ports:
    - 127.0.0.1:8000:8000
    environment:
      RDRS_ADMIN_TOKEN: ${RDRS_ADMIN_TOKEN:-}
      RDRS_AUTH_MODE: ${RDRS_AUTH_MODE:-password}
      RDRS_PUBLIC_URL: ${RDRS_PUBLIC_URL:-http://127.0.0.1:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RDRS_SESSION_SECRET: ${RDRS_SESSION_SECRET:-}
      RDRS_ADMIN_EMAILS: ${RDRS_ADMIN_EMAILS:-}
    volumes:
    - ./data/sandbox:/sandbox:ro
    - ./data/sensitive-lab:/sensitive-lab:ro
    - rdrs-runtime:/runtime
    restart: unless-stopped
volumes:
  rdrs-runtime: null
